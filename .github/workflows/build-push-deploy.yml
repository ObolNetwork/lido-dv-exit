on:
  push:
    branches:
      - main*
    tags:
      - 'v*'
name: Build and Publish Docker Image

env:
  IMAGE: obolnetwork/lido-dv-exit

jobs:
  # Each platform builds natively on its own runner, instead of arm64 under QEMU
  # emulation, and pushes an untagged image by digest. The merge job then tags a
  # multi-platform manifest list of both digests.
  build-docker:
    name: Build Docker Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0
    - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Login to Dockerhub container registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        username: obolnetwork
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Maybe overwrite app/version.Version with git tag
      if: github.ref_type == 'tag'
      run: echo 'GO_BUILD_FLAG=-ldflags=-X github.com/obolnetwork/lido-dv-exit/version.version=${{ github.ref_name }}' >> $GITHUB_ENV

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        # No provenance attestations, which show up as unknown/unknown platforms.
        provenance: false
        build-args: |
          GITHUB_SHA=${{ github.sha }}
          GO_BUILD_FLAG=${{ env.GO_BUILD_FLAG }}
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: digests-${{ matrix.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    name: Merge Docker Image Manifests
    runs-on: ubuntu-24.04
    needs: build-docker
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Download digests
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Get version.Version from the code
      if: github.ref_type == 'branch'
      run: echo "APP_VERSION=$(grep 'var version' version/version.go | cut -d'"' -f2)" >> $GITHUB_ENV

    - name: Define docker image meta data tags
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: |
          ${{ env.IMAGE }}
        tags: |
          # Tag "git short sha" on all git events
          type=sha,prefix=

          # Tag "latest" on git-push-to-main-branch events
          type=raw,value=latest,event=branch,enable={{is_default_branch}}

          # Tag "$APP_VERSION" on git-push-to-branch events
          type=raw,value=${{ env.APP_VERSION }},event=branch

          # Tag "tag ref" on git-tag events
          type=ref,event=tag

    - name: Login to Dockerhub container registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        username: obolnetwork
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.IMAGE }}@sha256:%s ' *)

    - name: Inspect image
      run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
