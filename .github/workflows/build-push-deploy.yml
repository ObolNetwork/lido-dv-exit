on:
  push:
    branches:
      - main*
    tags:
      - 'v*'
name: Build and Publish Docker Image

env:
  IMAGE: obolnetwork/lido-dv-exit

jobs:
  # Each platform builds natively on its own runner, instead of arm64 under QEMU
  # emulation, and pushes an untagged image by digest. The merge job then tags a
  # multi-platform manifest list of both digests.
  build-docker:
    name: Build Docker Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        fetch-depth: 0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to Dockerhub container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: obolnetwork
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Maybe overwrite app/version.Version with git tag
      if: github.ref_type == 'tag'
      run: echo 'GO_BUILD_FLAG=-ldflags=-X github.com/ObolNetwork/lido-dv-exit/app/version.version=${{ github.ref_name }}' >> $GITHUB_ENV

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        # Attach max-mode SLSA provenance and an SBOM to each platform image; registries list
        # these attestations as unknown/unknown platform entries of the manifest list.
        provenance: mode=max
        sbom: true
        build-args: |
          GITHUB_SHA=${{ github.sha }}
          GO_BUILD_FLAG=${{ env.GO_BUILD_FLAG }}
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: digests-${{ matrix.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    name: Merge Docker Image Manifests
    runs-on: ubuntu-24.04
    needs: build-docker
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: Download digests
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Get version.Version from the code
      if: github.ref_type == 'branch'
      run: echo "APP_VERSION=$(grep 'var version' app/version/version.go | cut -d'"' -f2)" >> $GITHUB_ENV

    - name: Define docker image meta data tags
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ${{ env.IMAGE }}
        tags: |
          # Tag "git short sha" on all git events
          type=sha,prefix=

          # Tag "latest" on git-push-to-main-branch events
          type=raw,value=latest,event=branch,enable={{is_default_branch}}

          # Tag "$APP_VERSION" on git-push-to-branch events
          type=raw,value=${{ env.APP_VERSION }},event=branch

          # Tag "tag ref" on git-tag events
          type=ref,event=tag

    - name: Login to Dockerhub container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: obolnetwork
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.IMAGE }}@sha256:%s ' *)

    - name: Inspect image
      run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
