on:
  push:
    tags:
      - 'v*'
name: Publish Release
jobs:
  release:
    runs-on: ubuntu-latest
    name: Publish Release
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0 # Disable shallow checkout
    - uses: ./.github/actions/setup-go
    - run: go run . --help > cli-reference.txt
    # Draft the release with GitHub's generated notes (merged PRs since the previous tag),
    # to edit before publishing. charon's testutil/genchangelog doesn't exist in this repo.
    - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        draft: true
        files: cli-reference.txt
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
        token: ${{ secrets.RELEASE_SECRET }}
