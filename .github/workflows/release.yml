on:
  push:
    tags:
      - 'v*'
name: Publish Release
jobs:
  release:
    runs-on: ubuntu-latest
    name: Publish Release
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        fetch-depth: 0 # Disable shallow checkout
    - uses: ./.github/actions/setup-go
    - run: go run . --help > cli-reference.txt
    # Draft the release with GitHub's generated notes (merged PRs since the previous tag),
    # to edit before publishing. charon's testutil/genchangelog doesn't exist in this repo.
    - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        draft: true
        files: cli-reference.txt
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
        token: ${{ secrets.RELEASE_SECRET }}
