name: govulncheck
on:
  pull_request:
  push:
    branches:
      - main*

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - uses: ./.github/actions/setup-go
      # govulncheck is a go.mod tool dependency, so go.sum pins it.
      - run: go tool govulncheck -show=traces -test ./...
